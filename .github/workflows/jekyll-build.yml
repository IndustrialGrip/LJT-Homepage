name: Jekyll build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Validate the single-page homepage
        run: |
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          site = Path('_site')
          pages = sorted(str(path.relative_to(site)) for path in site.rglob('*.html'))
          assert pages == ['index.html'], f'Unexpected HTML pages: {pages}'

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.add(attrs['id'])
                  for key in ('href', 'src'):
                      if attrs.get(key):
                          self.links.append(attrs[key])

              def handle_data(self, data):
                  self.text.append(data)

          html = (site / 'index.html').read_text()
          page = PageParser()
          page.feed(html)
          text = ' '.join(' '.join(page.text).split())
          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          for title in titles:
              assert title in text, f'Missing publication: {title}'
          for section in ('research-interests', 'education', 'research-experience', 'publications', 'honors', 'contact'):
              assert section in page.ids, f'Missing section: {section}'
          for placeholder in ('Your Name', 'Your Sidebar Name', 'Red Brick University', 'none@example.org', 'Paper Title Number'):
              assert placeholder not in html, f'Template placeholder remains: {placeholder}'
          for contact in (
              'mailto:jliugi@connect.ust.hk',
              'https://github.com/Vicent0205',
              'https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate',
              'https://x.com/junteng88716710',
          ):
              assert contact in page.links, f'Missing contact link: {contact}'

          base = '/LJT-Homepage'
          for link in page.links:
              url = urlsplit(link)
              if url.scheme not in ('', 'http', 'https'):
                  continue
              if url.netloc and url.netloc.lower() != 'industrialgrip.github.io':
                  continue
              path = unquote(url.path)
              if path:
                  assert path.startswith(base + '/'), f'Link missing project base path: {link}'
                  target = site / path[len(base) + 1:]
                  if path.endswith('/'):
                      target /= 'index.html'
                  assert target.is_file(), f'Missing local link target: {link}'
              if url.fragment and path in ('', base + '/'):
                  assert unquote(url.fragment) in page.ids, f'Missing anchor: {link}'

          manifest = json.loads((site / 'images/manifest.json').read_text())
          assert manifest['name'] == 'Junteng Liu'
          assert manifest['start_url'] == base + '/'
          for icon in manifest['icons']:
              assert icon['src'].startswith(base + '/')
              assert (site / icon['src'][len(base) + 1:]).is_file()

          print('PASS: index.html is the only HTML page.')
          print('PASS: all six publications, six sections, and four contact links are present.')
          print('PASS: no profile placeholders remain; local assets, anchors, and manifest resolve.')
          PY

      - name: Upload built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
